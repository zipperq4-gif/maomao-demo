<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>毛毛球 · 商家中心</title>
<style>
:root{--green:#247b51;--ink:#202923;--muted:#7e8781;--line:#e8ede8;--bg:#f6f8f6}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:var(--ink);font:14px "Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible{outline:2px solid var(--green)}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:95px}.top{background:white;padding:22px 20px 17px;border-bottom:1px solid var(--line)}.brand{font-size:12px;color:var(--green);font-weight:700;margin-bottom:14px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:7px}.avatar{height:38px;width:38px;border-radius:50%;background:#dcece1;display:grid;place-items:center;font-weight:bold;color:var(--green)}main{padding:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{margin-top:24px}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:3px;background:#eaf0ec;padding:3px;border-radius:6px}.tabs button{padding:7px 12px;font-size:12px;border-radius:4px}.tabs button.active{background:white;color:var(--green);box-shadow:0 1px 3px #182c1510}.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;margin-top:22px}.stat{border-right:1px solid var(--line);padding-left:15px}.stat:first-child{padding:0}.stat:last-child{border:0}.value{font-size:25px;font-weight:bold;margin-top:9px}.value span{font-size:12px;font-weight:normal;color:var(--muted)}.positive{font-size:11px;color:var(--green);margin-top:7px}.scan{width:100%;background:var(--green);color:white;display:flex;justify-content:space-between;align-items:center;padding:19px 20px;border-radius:8px;margin-top:24px;text-align:left}.scan strong{font-size:18px;display:block}.scan small{display:block;color:#cde2d4;margin-top:6px;font-size:12px}.scanicon{font-size:31px}.quick{display:grid;grid-template-columns:repeat(4,1fr);padding:21px 0 3px}.quick button{display:grid;justify-items:center;gap:9px;font-size:12px}.icon{font-size:22px;font-weight:normal;color:var(--green)}.todo{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.todo .count{margin-left:auto;font-weight:bold;color:#b6732a}.dot{width:7px;height:7px;border-radius:50%;background:#bd7b32}.link{color:var(--green);font-size:12px;padding:6px 0}.dates{display:flex;gap:8px;overflow:auto;margin:16px 0}.date{flex:1;min-width:52px;border:1px solid var(--line);border-radius:6px;background:white;padding:9px 6px;font-size:12px;text-align:center;white-space:nowrap}.date b{display:block;margin-top:5px;font-size:15px}.date.active{background:var(--green);color:white;border-color:var(--green)}.legend{display:flex;gap:12px;font-size:10px;color:var(--muted);margin:13px 0}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}.board{overflow:auto;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:43px repeat(3,minmax(80px,1fr));gap:5px;min-width:300px}.cell{height:43px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:4px;background:white;border:1px solid var(--line)}.cell.head,.cell.time{background:none;border:0;color:var(--muted)}.cell.head{height:34px}.cell.time{font-size:11px}.booked{background:#e5edf8;color:#4973a4;border-color:#e5edf8}.course{background:#eeebf8;color:#7d68a1;border-color:#eeebf8}.locked{background:#f7eedf;color:#ac7936;border-color:#f7eedf}.closed{background:#e9ece9;color:#949b95}.cell.selected{outline:2px solid var(--green);background:#e5f1e8}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 5px max(14px,env(safe-area-inset-bottom));z-index:5}.nav button{display:grid;gap:5px;justify-items:center;color:#929992;font-size:11px}.nav button.active{color:var(--green);font-weight:bold}.nav .icon{color:inherit;font-size:21px}.pill{font-size:11px;padding:4px 7px;border-radius:4px;background:#e6f1e9;color:var(--green)}.orange{background:#fbefde;color:#a76a25}.blue{background:#e7edf6;color:#57759d}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:12px}.card p{font-size:12px;color:var(--muted);line-height:1.7;margin:9px 0}.price{font-size:21px;font-weight:bold}.actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.btn{padding:10px 16px;border:1px solid var(--line);border-radius:5px;background:white;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.filter{display:flex;gap:18px;overflow:auto;border-bottom:1px solid var(--line);margin:14px 0 17px;white-space:nowrap}.filter button{padding:10px 0;font-size:12px;color:var(--muted)}.filter button.active{color:var(--green);border-bottom:2px solid var(--green);font-weight:bold}.search{width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:12px;margin-top:16px;font-size:12px}.photo{height:136px;object-fit:cover;width:100%;border-radius:6px;margin:13px 0}.menu{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line)}.menu span:last-child{color:var(--muted)}.notice{background:#eef3ef;font-size:12px;padding:12px;border-radius:5px;color:#65816d;line-height:1.6;margin-top:16px}.overlay{position:fixed;inset:0;background:#16231d66;z-index:10;display:flex;justify-content:center;align-items:flex-end}.sheet{background:white;width:min(100%,480px);padding:22px 22px max(24px,env(safe-area-inset-bottom));border-radius:12px 12px 0 0;max-height:90vh;overflow:auto}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:5px;margin-top:7px;background:white}.sheet label{display:block;margin-top:16px;font-size:12px;color:var(--muted)}.sheet .actions .btn{flex:1}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#243b2e;color:white;border-radius:6px;padding:12px 18px;z-index:20;font-size:12px;max-width:90%;white-space:nowrap}.scanarea{height:200px;background:#f0f4f1;display:grid;place-items:center;margin-top:20px;border-radius:6px}.frame{height:130px;width:130px;border:3px solid var(--green);display:grid;place-items:center;font-size:55px;color:var(--green)}.empty{padding:45px 0;text-align:center;color:var(--muted)}@media(min-width:600px){.app{margin:26px auto;min-height:calc(100vh - 52px);box-shadow:0 8px 45px #273c2412}.nav{bottom:0}} 
</style></head><body><div class="app"><header class="top"><div class="brand">毛毛球 / 商家中心</div><div class="heading"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><button class="avatar" onclick="modal('account')" title="场馆账户">ATP</button></div></header><main id="main"></main><nav class="nav" id="nav"></nav></div><div id="modal"></div><div id="toast"></div>
<script>
const state={page:'home',day:0,range:'今日',orderFilter:'全部',orderType:'场地订单',tab:'实况看板',query:'',orders:[{id:'202610140031',name:'3号场 · 室内硬地',user:'林先生 · 手机尾号 4569',time:'10月14日 18:00–19:00',price:120,status:'待核销'},{id:'202610140029',name:'亲子网球 · 启蒙体验',user:'陈女士 · 亲子 1 组',time:'10月14日 16:00–17:00',price:168,status:'退款申请中',course:true},{id:'202610140026',name:'1号场 · 室内硬地',user:'王先生 · 手机尾号 2081',time:'10月14日 09:00–10:00',price:80,status:'已完成'}],courts:['1号场','2号场','3号场'],overrides:{}};
const $=id=>document.getElementById(id);const navs=[['home','⌂','工作台'],['schedule','▦','排期'],['orders','▤','订单'],['manage','⚙','管理']];
function go(p){state.page=p;render();window.scrollTo(0,0)}function tabs(items,active,action){return '<div class="tabs">'+items.map(v=>`<button class="${v===active?'active':''}" onclick="${action}('${v}')">${v}</button>`).join('')+'</div>'}function setRange(v){state.range=v;render()}function setTab(v){state.tab=v;render()}function setDay(i){state.day=i;render()}function dates(){return '<div class="dates">'+['今天','明天','周五','周六','周日'].map((v,i)=>`<button class="date ${state.day===i?'active':''}" onclick="setDay(${i})">${v}<b>10.${14+i}</b></button>`).join('')+'</div>'}
function board(short=false){let html='<div class="legend">'+[['#e5edf8','已预订'],['#eeebf8','课程'],['#f7eedf','锁场'],['#e9ece9','闭场']].map(([c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+'</div><div class="board"><div class="grid"><div class="cell head"></div>'+state.courts.slice(0,3).map(c=>`<div class="cell head">${c}</div>`).join('');for(let h=short?16:8;h<(short?21:22);h++){html+=`<div class="cell time">${h}:00</div>`;for(let c=0;c<3;c++){let k=`${state.day}-${h}-${c}`,v=state.overrides[k]||((h===16&&c===1)?['course','亲子启蒙']:(h===18&&c===2)?['booked','林先生']:(h===19&&c===0)?['locked','维护锁场']:['',`¥${h<12?80:h<16?100:120}`]);html+=`<button class="cell ${v[0]}" onclick="slot('${k}',${h},${c})">${v[1]}</button>`}}return html+'</div></div>'}
function render(){const titles={home:['ATP 国际网球中心','深圳 · 南山区   ▾'],schedule:['场地排期','ATP 国际网球中心'],orders:['全部订单','ATP 国际网球中心'],manage:['场馆管理','ATP 国际网球中心'],courses:['课程管理','3 门课程 · 2 门已上架'],members:['会员管理','128 位场馆会员'],courts:['场地管理',`${state.courts.length} 个场地 · 正常营业`],venue:['场馆信息','资料已认证']};$('title').textContent=titles[state.page][0];$('subtitle').textContent=titles[state.page][1];$('nav').innerHTML=navs.map(([p,i,t])=>`<button class="${state.page===p||(['courses','members','courts','venue'].includes(state.page)&&p==='manage')?'active':''}" onclick="go('${p}')"><span class="icon">${i}</span>${t}</button>`).join('');let s='';if(state.page==='home'){s=`<div class="row"><h2>经营概览</h2>${tabs(['今日','近7天'],state.range,'setRange')}</div><div class="stats"><div class="stat"><div class="small">实收金额</div><div class="value">¥${state.range==='今日'?'2,480':'16,820'}</div><div class="positive">较上期 +12.6%</div></div><div class="stat"><div class="small">已订场时</div><div class="value">${state.range==='今日'?'26':'182'}<span> 小时</span></div><div class="positive">共 42 小时可售</div></div><div class="stat"><div class="small">利用率</div><div class="value">62<span>%</span></div><div class="positive">较上期 +8%</div></div></div><button class="scan" onclick="modal('scan')"><div><strong>扫码核销</strong><small>场地预约 · 课程签到</small></div><span class="scanicon">▣</span></button><div class="quick">${[['orders','▤','全部订单'],['schedule','▦','排期定价'],['courses','◇','课程管理'],['members','♧','会员管理']].map(([p,i,t])=>`<button onclick="go('${p}')"><span class="icon">${i}</span>${t}</button>`).join('')}</div><section class="section"><div class="row"><h2>待处理</h2><span class="small">及时跟进每一笔预约</span></div><button class="todo" style="width:100%" onclick="state.orderFilter='售后';go('orders')"><i class="dot"></i>退款申请<span class="count">${state.orders.filter(o=>o.status==='退款申请中').length} 笔</span><span>›</span></button><button class="todo" style="width:100%" onclick="state.orderFilter='待核销';go('orders')"><i class="dot" style="background:#638ab4"></i>今日待核销<span class="count">${state.orders.filter(o=>o.status==='待核销').length} 笔</span><span>›</span></button></section><section class="section"><div class="row"><h2>今日场地</h2><button class="link" onclick="go('schedule')">完整看板 ›</button></div>${board(true)}</section>`}
else if(state.page==='schedule'){s=`<div class="row">${tabs(['实况看板','规则定价'],state.tab,'setTab')}<button class="link" onclick="modal('rules')">编辑规则</button></div>`;if(state.tab==='实况看板')s+=dates()+`<div class="row"><h2>场地实况</h2><span class="small">刚刚更新</span></div>`+board();else s+=`<div class="notice">当前规则 · 每天重复 · 10月14日起生效</div>${state.courts.map(c=>`<div class="card"><div class="row"><h3>${c} · 室内硬地</h3><span class="pill">已发布</span></div><div class="menu"><span>08:00–12:00</span><b>¥80 /小时</b></div><div class="menu"><span>12:00–16:00</span><b>¥100 /小时</b></div><div class="menu"><span>16:00–22:00</span><b>¥120 /小时</b></div><div class="actions"><button class="btn" onclick="modal('rules')">修改定价</button></div></div>`).join('')}`}
else if(state.page==='orders'){s=`<div class="row">${tabs(['场地订单','课程订单'],state.orderType,'orderType')}<button class="link" onclick="modal('scan')">▣ 核销</button></div><input class="search" placeholder="搜索订单号 / 联系人" value="${state.query}" oninput="state.query=this.value;renderOrders()"><div class="filter">${['全部','待核销','已完成','售后'].map(v=>`<button class="${state.orderFilter===v?'active':''}" onclick="state.orderFilter='${v}';render()">${v}</button>`).join('')}</div><div id="orderlist"></div>`}
else if(state.page==='manage'){s=`<img class="photo" alt="网球场" src="https://images.unsplash.com/photo-1554068865-24cecd4e34b8?auto=format&fit=crop&w=900&q=80"><div class="row"><h2>ATP 国际网球中心</h2><span class="pill">已认证</span></div><div class="sub">深圳市南山区 · 营业时间 08:00–22:00</div><section class="section">${[['courses','课程管理','2 门已上架'],['members','会员管理','128 位会员'],['courts','场地管理',state.courts.length+' 个场地'],['venue','场馆信息','资料已完善']].map(([p,n,v])=>`<button class="menu" style="width:100%" onclick="go('${p}')"><span>${n}</span><span>${v}　›</span></button>`).join('')}<button class="menu" style="width:100%" onclick="modal('income')"><span>收支明细</span><span>›</span></button><button class="menu" style="width:100%" onclick="modal('staff')"><span>员工与权限</span><span>3 位员工　›</span></button></section>`}
else if(state.page==='courses'){s=`<div class="row"><button class="link" onclick="go('manage')">‹ 返回</button><button class="btn primary" onclick="modal('newcourse')">＋ 创建课程</button></div>${['亲子网球 · 启蒙体验','成人网球 · 入门团课','周末进阶训练'].map((n,i)=>`<div class="card"><div class="row"><h3>${n}</h3><span class="pill ${i===2?'orange':''}">${i===2?'草稿':'已上架'}</span></div><p>${i===0?'4–8岁 · 亲子1组': '成人 · 4人小班'}<br>教练：李教练 · 每节60分钟<br>${i===2?'尚未安排场次':'最近开课：10月15日 16:00 · 余位 2'}</p><div class="row"><span class="price">¥${i===0?168:128}<span class="small"> /节</span></span><button class="btn" onclick="modal('arrange')">${i===2?'去排课':'管理场次'}</button></div></div>`).join('')}`}
else if(state.page==='members'){s=`<div class="row"><button class="link" onclick="go('manage')">‹ 返回</button><button class="btn primary" onclick="modal('member')">＋ 添加会员</button></div><input class="search" placeholder="搜索会员姓名 / 手机尾号" oninput="document.querySelectorAll('.member').forEach(e=>e.hidden=!e.textContent.includes(this.value))">${['林先生 · 4569','陈女士 · 8902','王先生 · 2081'].map((n,i)=>`<div class="menu member"><div><h3>${n}</h3><div class="sub">累计预约 ${12+i*5} 次 · 最近到访 10月14日</div></div><button class="link" onclick="modal('memberdetail')">查看 ›</button></div>`).join('')}`}
else if(state.page==='courts'){s=`<div class="row"><button class="link" onclick="go('manage')">‹ 返回</button><button class="btn primary" onclick="modal('newcourt')">＋ 添加场地</button></div>${state.courts.map((n,i)=>`<div class="card"><div class="row"><h3>${n} · 室内硬地</h3><span class="pill">营业中</span></div><p>营业时间 08:00–22:00<br>排期定价已配置</p><div class="actions"><button class="btn" onclick="modal('pause')">暂停开放</button><button class="btn primary" onclick="go('schedule')">排期定价</button></div></div>`).join('')}`}
else if(state.page==='venue'){s=`<button class="link" onclick="go('manage')">‹ 返回</button>${[['场馆名称','ATP 国际网球中心'],['联系电话','0755-8888 2366'],['地址','深圳市南山区塘朗网球中心'],['营业时间','08:00–22:00'],['场馆设施','停车 · 淋浴 · 器材租赁'],['资质认证','已认证']].map(([n,v])=>`<div class="menu"><span>${n}</span><span>${v}</span></div>`).join('')}<div class="section"><button class="btn primary" style="width:100%" onclick="modal('venueedit')">编辑场馆信息</button></div>`} $('main').innerHTML=s;if(state.page==='orders')renderOrders()}
function orderType(v){state.orderType=v;render()}function renderOrders(){let os=state.orders.filter(o=>!!o.course===(state.orderType==='课程订单')).filter(o=>state.orderFilter==='全部'||(state.orderFilter==='售后'?/退款/.test(o.status):o.status===state.orderFilter)).filter(o=>(o.id+o.user).includes(state.query));$('orderlist').innerHTML=os.length?os.map(o=>`<div class="card"><div class="row"><span class="small">订单 ${o.id.slice(-6)}</span><span class="pill ${/退款/.test(o.status)?'orange':''}">${o.status}</span></div><h3 style="margin-top:15px">${o.name}</h3><p>${o.time}<br>${o.user}</p><div class="row"><span class="small">实付金额</span><span class="price">¥${o.price}</span></div><div class="actions"><button class="btn" onclick="detail('${o.id}')">订单详情</button>${o.status==='待核销'?`<button class="btn primary" onclick="verify('${o.id}')">核销</button>`:o.status==='退款申请中'?`<button class="btn primary" onclick="refund('${o.id}')">处理退款</button>`:''}</div></div>`).join(''):'<div class="empty">暂无相关订单</div>'}
function closeModal(){$('modal').innerHTML=''}function sheet(title,body,buttons=''){ $('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row"><h2>${title}</h2><button onclick="closeModal()" style="font-size:23px" aria-label="关闭">×</button></div>${body}${buttons?'<div class="actions">'+buttons+'</div>':''}</div></div>`}function ok(text){closeModal();render();$('toast').innerHTML=`<div class="toast">${text}</div>`;setTimeout(()=>$('toast').innerHTML='',2500)}function detail(id){let o=state.orders.find(x=>x.id===id);sheet('订单详情',`<div class="notice">${o.status}</div><h3 style="margin-top:18px">${o.name}</h3><p>${o.time}</p><p>${o.user}</p><div class="menu"><span>订单号</span><span>${o.id}</span></div><div class="menu"><span>实付</span><b>¥${o.price}</b></div>`,o.status==='待核销'?`<button class="btn" onclick="refund('${id}')">取消并退款</button><button class="btn primary" onclick="verify('${id}')">确认核销</button>`:'')}
function verify(id){let o=state.orders.find(x=>x.id===id);sheet('核对预约',`<div class="notice">待核销 · 订单 ${o.id.slice(-6)}</div><h3 style="margin-top:18px">${o.name}</h3><p>${o.time}</p><p>${o.user}</p><div class="menu"><span>已支付</span><b>¥${o.price}</b></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="state.orders.find(x=>x.id==='${id}').status='已完成';ok('核销成功')">确认核销</button>`)}function refund(id){let o=state.orders.find(x=>x.id===id);sheet('处理退款',`<p>${o.name}</p><div class="menu"><span>最高可退</span><b>¥${o.price}</b></div><label>本次退款金额<input id="amount" type="number" min="0.01" max="${o.price}" value="${o.price}"></label><label>退款原因<select><option>用户申请取消</option><option>场馆原因取消</option><option>其他原因</option></select></label><div class="notice">原路退回 · 提交后由支付渠道处理</div>`,`<button class="btn" onclick="closeModal()">返回</button><button class="btn primary" onclick="submitRefund('${id}')">确认退款</button>`)}function submitRefund(id){let o=state.orders.find(x=>x.id===id),v=Number($('amount').value);if(!(v>0&&v<=o.price)){alert('请输入可退范围内的金额');return}o.status='退款处理中';ok('退款已提交，等待渠道处理')}
function slot(k,h,c){sheet(`${state.courts[c]} · 10月${14+state.day}日`, `<p>${h}:00–${h+1}:00</p><label>场次安排<select id="slotstate"><option value="price">开放预约</option><option value="locked">临时锁场</option><option value="course">课程占用</option></select></label><label>价格（元 / 小时）<input id="slotprice" type="number" value="120" min="0"></label><label>备注<input id="slotnote" placeholder="填写锁场原因或课程名称"></label>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveSlot('${k}',${h},${c})">保存安排</button>`)}function saveSlot(k,h,c){if(h===18&&c===2){alert('该时段已有订单，请先处理预约');return}let t=$('slotstate').value,n=$('slotnote').value,p=Number($('slotprice').value);if(t!=='price'&&!n.trim()){alert('请填写原因或课程名称');return}if(t==='price'&&(!Number.isFinite(p)||p<0)){alert('请输入有效价格');return}state.overrides[k]=t==='price'?['','¥'+p]:[t,n];ok('场次安排已保存')}
function modal(t){if(t==='scan'){sheet('扫码核销',`<div class="scanarea"><div class="frame">▣</div></div><label>订单号 / 核销码<input id="code" placeholder="输入订单号或核销码"></label>`,`<button class="btn" onclick="verify('202610140031')">演示识别订单</button><button class="btn primary" onclick="lookup()">查询订单</button>`)}else if(t==='rules'){sheet('编辑排期定价',`<label>适用场地<select><option>全部场地</option>${state.courts.map(n=>'<option>'+n+'</option>').join('')}</select></label><label>重复方式<select><option>每天相同</option><option>工作日 / 周末</option><option>按星期设置</option></select></label><label>生效日期<input type="date" value="2026-10-15"></label><label>08:00–12:00 · 元/小时<input type="number" value="80"></label><label>12:00–16:00 · 元/小时<input type="number" value="100"></label><label>16:00–22:00 · 元/小时<input type="number" value="120"></label><div class="notice">已支付预约与已发布课程保留原价格及安排。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="ok('排期规则已保存为演示方案')">保存方案</button>`)}else if(t==='newcourt'){sheet('添加场地',`<label>场地名称<input id="courtname" placeholder="如：4号场" required></label><label>场地类型<select><option>室内硬地</option><option>室外硬地</option><option>室外红土</option></select></label>`,`<button class="btn primary" onclick="addCourt()">确认添加</button>`)}else if(t==='newcourse'||t==='arrange'){sheet(t==='newcourse'?'创建课程':'安排课程场次',`<label>课程名称<input placeholder="课程标题" value="${t==='arrange'?'亲子网球 · 启蒙体验':''}"></label><label>授课教练<select><option>李教练</option><option>陈教练</option></select></label><label>开课日期<input type="date" value="2026-10-15"></label><label>场地<select>${state.courts.map(n=>'<option>'+n+'</option>').join('')}</select></label><label>开始时间<input type="time" value="16:00"></label><label>报名总价（元 / 节）<input type="number" value="168"></label><label>名额上限<input type="number" value="4"></label>`,`<button class="btn" onclick="ok('课程草稿已保存（演示）')">存草稿</button><button class="btn primary" onclick="ok('课程方案已保存（演示）')">保存课程</button>`)}else if(t==='pause'){sheet('暂停开放',`<label>暂停原因<select><option>场地维护</option><option>天气原因</option><option>其他</option></select></label><label>恢复时间<input type="datetime-local" value="2026-10-15T08:00"></label><div class="notice">1 笔预约受影响：林先生 · 今日18:00–19:00。请先完成改期或取消。</div>`,`<button class="btn primary" onclick="closeModal();go('orders')">处理受影响订单</button>`)}else if(t==='member'){sheet('添加会员',`<label>用户手机号<input type="tel" placeholder="输入手机号"></label><label>场馆备注<input placeholder="备注仅场馆内部可见"></label>`,`<button class="btn primary" onclick="ok('邀请方案已保存，未实际发送')">保存邀请</button>`)}else if(t==='memberdetail'){sheet('会员详情',`<h3 style="margin-top:20px">林先生</h3><p>手机尾号 4569 · 加入于2026年8月</p><div class="menu"><span>累计预约</span><b>12 次</b></div><div class="menu"><span>累计消费</span><b>¥1,440</b></div><label>内部备注<input value="常约工作日晚间"></label>`,`<button class="btn primary" onclick="ok('备注已保存（演示）')">保存备注</button>`)}else if(t==='income'){sheet('收支明细',`<div class="menu"><span>今日收入</span><b>¥2,480</b></div><div class="menu"><span>今日退款</span><b>¥168</b></div><div class="menu"><span>场地预约 · 14:32</span><b>+ ¥120</b></div><div class="menu"><span>课程报名 · 13:08</span><b>+ ¥168</b></div>`)}else if(t==='staff'){sheet('员工与权限',`<div class="menu"><span>急急国王</span><span>负责人</span></div><div class="menu"><span>李教练</span><span>课程运营</span></div><div class="menu"><span>小陈</span><span>前台 · 核销权限</span></div>`)}else if(t==='venueedit'){sheet('编辑场馆信息',`<label>名称<input value="ATP 国际网球中心"></label><label>联系电话<input type="tel" value="0755-88882366"></label><label>详细地址<input value="深圳市南山区塘朗网球中心"></label><label>营业开始<input type="time" value="08:00"></label><label>营业结束<input type="time" value="22:00"></label>`,`<button class="btn primary" onclick="ok('场馆资料已保存（演示）')">保存修改</button>`)}else{sheet('场馆账户',`<div class="menu"><span>急急国王</span><span>场馆负责人</span></div><div class="menu"><span>当前场馆</span><span>ATP 国际网球中心</span></div><div class="notice">专业模式 · 场馆主 · 已认证</div>`)}}
function lookup(){let code=$('code').value.trim(),o=state.orders.find(x=>x.id===code||x.id.slice(-6)===code);if(!o){alert('未找到订单，请检查订单号');return}if(o.status!=='待核销'){alert('当前订单状态为：'+o.status);return}verify(o.id)}function addCourt(){let n=$('courtname').value.trim();if(!n){alert('请填写名称');return}if(state.courts.includes(n)){alert('场地名称已存在');return}state.courts.push(n);ok('场地已添加，请配置排期定价')}render();
</script>
