<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场地预约定价 · 老版 A</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}h1,h2,h3,p{margin:0}.layout{display:flex;justify-content:center;gap:40px;padding:30px 18px}.aside{width:230px;padding-top:55px}.aside h1{font-size:27px;margin:18px 0}.aside p{color:#78808a;font-size:13px;margin:12px 0}.phone{width:393px;height:calc(100dvh - 60px);min-height:650px;background:#f7f8fa;border-radius:28px;border:6px solid white;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 15px 55px #2221}.top{height:58px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:10px}.top h1{font-size:17px}.scroll{overflow:auto;flex:1;padding:16px}.steps{display:flex;gap:4px;margin-bottom:14px}.steps span{flex:1;text-align:center;padding:7px 2px;border-radius:5px;background:#eceef1;color:#7f858b;font-size:11px}.steps .active{background:#fff0ea;color:#f15c38;font-weight:600}.card{background:white;border-radius:12px;padding:16px;margin-bottom:13px}.field{display:block;margin:14px 0;font-size:13px}.field input,.field select{display:block;width:100%;padding:11px;border:1px solid #e0e3e6;border-radius:8px;background:#fafafa;margin-top:6px}.grid{display:grid;grid-template-columns:42px repeat(7,1fr);gap:3px;margin-top:12px}.cell{height:25px;border:1px solid #e4e7ea;background:#fff;border-radius:3px;font-size:9px;padding:0}.cell.head,.cell.time{border:0;background:transparent;color:#7c8287}.cell.selected{background:#fff0ea;color:#e94f2b;border-color:#f6a48e}.cell.price{background:#fee8df;color:#d44c2c}.btn{display:block;width:100%;background:#f35d38;color:white;border-radius:8px;padding:12px;text-align:center;margin-top:12px}.secondary{background:#f1f2f3;color:#4e555a}.orange{color:#e85432}.rule{border:1px solid #eceef0;border-radius:9px;padding:12px;margin-top:9px}.rule .row{display:flex;justify-content:space-between}.muted{font-size:12px;color:#81888f}.notice{background:#fff3ed;color:#b04a31;padding:11px;border-radius:8px;font-size:12px;margin-top:13px}.success{text-align:center;padding:35px 5px}.check{font-size:50px;color:#f35d38}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px}.toast:empty{display:none}@media(max-width:700px){.aside{display:none}.layout{padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}
</style></head><body><div class="layout"><aside class="aside"><strong>方案 A / 老版本</strong><h1>一步一步填写，<br>再发布价格。</h1><p>保留原来的场地选择、规则表单、日期设置和价格预览。</p><p>与新版比较：填写是否容易理解，错误是否容易发现。</p><a href="排期定价-规则对比版.html">打开新版 B 对比 ↗</a></aside><main class="phone"><header class="top"><button onclick="back()" aria-label="返回">‹</button><h1>场地预约定价</h1></header><div class="scroll" id="app"></div></main></div><div class="toast" id="toast"></div><script>
'use strict';let stage=0,venue='1号场',base=80,rules=[{name:'工作日晚场',days:[1,2,3,4,5],start:'18:00',end:'22:00',price:120},{name:'周末全天',days:[6,7],start:'08:00',end:'22:00',price:130}],noticeTimer;const days=['一','二','三','四','五','六','日'];const app=document.getElementById('app');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(v){document.getElementById('toast').textContent=v;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.getElementById('toast').textContent='',2500)}function steps(){return `<div class="steps">${['选择场地','编辑规则','确认发布'].map((v,i)=>`<span class="${stage===i?'active':''}">${i+1} ${v}</span>`).join('')}</div>`}function back(){if(stage===0)location.href='index.html';else{stage--;render()}}function render(){if(stage===0)selectVenue();if(stage===1)edit();if(stage===2)review();if(stage===3)success();}function selectVenue(){app.innerHTML=steps()+`<section class="card"><h2>选择场地</h2><p class="muted">选择一片场地设置长期预约价格。</p><label class="field">场地<select id="venue"><option>1号场</option><option>2号场</option><option>3号场</option></select></label><label class="field">开始生效<input id="start" type="date" value="2026-10-28"></label><button class="btn" onclick="venue=document.getElementById('venue').value;stage=1;render()">下一步：编辑规则</button></section>`}function edit(){app.innerHTML=steps()+`<section class="card"><h2>基础价格</h2><p class="muted">没有规则覆盖的时段使用此价格</p><label class="field">每小时价格<input id="base" type="number" value="${base}"></label></section><section class="card"><div style="display:flex;justify-content:space-between"><h2>价格规则</h2><span class="muted">${rules.length}条</span></div>${rules.map((r,i)=>`<div class="rule"><div class="row"><strong>${esc(r.name)}</strong><span class="orange">¥${r.price}/时</span></div><p class="muted">周${r.days.join('、')} · ${r.start}–${r.end}</p></div>`).join('')}<button class="btn secondary" onclick="toast('老版通过表单添加规则')">＋ 添加价格规则</button></section><section class="card"><h2>一周价格预览</h2><p class="muted">点击格子查看该时段最终价格。</p><div class="grid">${days.map(d=>`<span class="cell head">${d}</span>`).join('')}${Array.from({length:14},(_,row)=>`<span class="cell time">${8+row}:00</span>`+days.map((d,col)=>`<button class="cell ${row>=10&&col<5?'price':''}" onclick="toast('周${d} ${8+row}:00 · 点击查看或修改规则')">${row>=10&&col<5?120:base}</button>`).join('')).join('')}</div></section><button class="btn" onclick="base=Number(document.getElementById('base').value)||base;stage=2;render()">下一步：确认发布</button>`}function review(){app.innerHTML=steps()+`<section class="card"><h2>发布前总览</h2><p class="muted">应用到场地：<strong>${venue}</strong></p><p class="muted">开始生效：2026-10-28 · 长期有效</p><div class="notice">发布后规则立即生效；已有订单、课程和支付占位保留原价格。</div>${rules.map(r=>`<div class="rule"><div class="row"><strong>${r.name}</strong><strong>¥${r.price}/时</strong></div><p class="muted">周${r.days.join('、')} · ${r.start}–${r.end}</p></div>`).join('')}<button class="btn secondary" onclick="stage=1;render()">返回修改</button><button class="btn" onclick="stage=3;render()">确认发布</button></section>`}function success(){app.innerHTML=`<section class="card success"><div class="check">✓</div><h2>定价规则已发布</h2><p class="muted" style="margin-top:9px">${venue} · 2026-10-28起生效</p><button class="btn" onclick="stage=0;render()">返回排期定价</button><button class="btn secondary" onclick="stage=1;render()">继续修改方案</button></section>`}render();</script><script src="老版AB-任务交互.js"></script><script src="老版AB-原稿复刻.js"></script><script src="临时改价-矩形框选.js"></script><script src="实验配置.js"></script><script src="实验埋点.js"></script><script src="实验任务卡.js"></script></body></html>
