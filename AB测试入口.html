<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排期定价体验测试</title>
<style>body{max-width:540px;margin:35px auto;padding:22px;background:#f6f7f3;color:#292d27;font:15px/1.8 sans-serif}button{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#292d27;color:#fff;margin-top:16px;font:inherit;cursor:pointer}p{color:#737b68}input,select{padding:10px;font:inherit;width:100%;box-sizing:border-box}label{display:block;margin-top:15px}.consent{display:flex;gap:8px;align-items:start}.consent input{width:auto;margin-top:7px}.status{font-size:13px}</style>
<h1>场地定价体验测试</h1><p>测试的是界面，不是你的能力。请按主持人提供的任务操作，无需填写真实姓名。</p>
<label>参与者代号<input id="participant" placeholder="例如 P01" maxlength="40"></label>
<label>测试顺序<select id="order"><option value="AB">先 A 后 B</option><option value="BA">先 B 后 A</option></select></label>
<label>第一轮案例<select id="firstCase"><option>S1</option><option>S2</option><option>C1</option><option>C2</option></select></label>
<label>第二轮案例<select id="secondCase"><option>S2</option><option>S1</option><option>C2</option><option>C1</option></select></label>
<label class="consent"><input id="consent" type="checkbox"><span>我知悉本次测试会自动记录参与者代号、操作过程、定价配置、用时与错误，并上传给测试主持人。不录音、不录像。</span></label>
<button onclick="start()">开始第一轮</button><button onclick="second()">开始第二轮</button><p>每轮开始会重置该版本的定价数据。完成后，在原型右上角“实验记录”中结束本轮。实验日志会保留。</p>
<p id="connection" class="status"></p>
<p>离开、关闭或刷新原型页面会自动结束本轮；退出不代表任务完成，可直接开始下一轮。</p>
<script src="实验配置.js"></script><script src="实验埋点.js"></script>
<script>
function clearVersion(version){const keys=version==='A'?['maomao-old-long-drafts','maomao-old-ab-plans','maomao-old-temporary-draft-1号场','maomao-old-temporary-draft-2号场','maomao-old-temporary-draft-3号场']:['maomao-pricing-workflow-v1','maomao-pricing-working-draft','maomao-rule-pricing-courts-v1'];keys.forEach(key=>localStorage.removeItem(key));}
function runVersion(index){const participant=document.getElementById('participant').value.trim();if(!participant)return alert('请填写参与者代号');if(!document.getElementById('consent').checked)return alert('请先确认已知悉实验记录说明');let previous;try{previous=JSON.parse(sessionStorage.getItem('maomao-experiment-active-run'));}catch{}if(previous&&!previous.ended)Experiment.finish('exited');const order=document.getElementById('order').value,version=order[index],caseId=document.getElementById(index===0?'firstCase':'secondCase').value;clearVersion(version);sessionStorage.setItem('test-participant',participant);Experiment.begin({participant,version,caseId,order});location.href=version==='A'?'排期定价-老版本AB.html':'排期定价-规则对比版.html';}
function start(){runVersion(0);}function second(){runVersion(1);}
async function checkConnection(){const label=document.getElementById('connection');if(!EXPERIMENT_CONFIG.endpoint){label.textContent='上传接口尚未配置，暂不建议正式测试。';return;}label.textContent='检查接收服务…';try{const response=await fetch(EXPERIMENT_CONFIG.endpoint+'/health',{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error();label.textContent='接收服务在线，操作记录将自动上传。';}catch{label.textContent='接收服务暂不可达。测试中记录会在当前浏览器保留，恢复后重试；请联系主持人。';}}
checkConnection();
</script></html>
