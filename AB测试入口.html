<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排期定价体验测试</title><style>body{max-width:540px;margin:45px auto;padding:22px;background:#f6f7f3;color:#292d27;font:15px/1.8 sans-serif}a,button{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:10px;background:#292d27;color:#fff;text-decoration:none;text-align:center;margin-top:16px;font:inherit}p{color:#737b68}input,select{padding:10px;font:inherit;width:100%;box-sizing:border-box}label{display:block;margin-top:15px}</style><h1>场地定价体验测试</h1><p>测试的是界面，不是你的能力。请按主持人提供的任务操作，无需填写真实姓名。</p><label>参与者代号<input id="participant" placeholder="例如 P01"></label><label>测试顺序<select id="order"><option value="AB">先 A 后 B</option><option value="BA">先 B 后 A</option></select></label><button onclick="start()">开始第一轮</button><button onclick="second()">开始第二轮</button><p>每轮开始会重置该版本测试数据。请先记录结果再进入下一轮。</p><script>function clearVersion(version){const keys=version==='A'?['maomao-old-ab-plans']:['maomao-pricing-workflow-v1','maomao-pricing-working-draft'];keys.forEach(key=>localStorage.removeItem(key));}function run(version){const id=document.getElementById('participant').value.trim();if(!id){alert('请填写参与者代号');return;}clearVersion(version);sessionStorage.setItem('test-participant',id);location.href=version==='A'?'排期定价-老版本AB.html':'排期定价-规则对比版.html';}function start(){run(document.getElementById('order').value[0]);}function second(){run(document.getElementById('order').value[1]);}</script></html>
