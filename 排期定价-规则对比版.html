<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场地定价 · 规则对比版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2ef;color:#262a25;font:14px/1.7 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}h1,h2,h3,p{margin:0}a{color:inherit}.layout{display:flex;justify-content:center;gap:40px;padding:30px 18px}.aside{width:230px;padding-top:45px}.aside h1{font-size:26px;margin:20px 0}.aside p{font-size:13px;color:#767d70;margin:12px 0}.aside a{display:block;margin-top:20px}.phone{width:393px;background:#f7f8f5;border:6px solid white;border-radius:27px;height:calc(100dvh - 60px);min-height:650px;display:flex;flex-direction:column;overflow:hidden}.top{padding:15px 17px;background:white;display:flex;align-items:center;gap:12px}.top h1{font-size:17px}.scroll{overflow:auto;padding:16px;flex:1}.card{background:white;border-radius:13px;padding:17px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:16px}h3{font-size:14px}.muted{font-size:12px;color:#777f71}.btn{display:block;width:100%;background:#292d27;color:white;border-radius:9px;padding:12px;text-align:center;margin-top:15px;text-decoration:none}.secondary{background:#eef1e9;color:#33392e}.link{font-size:12px;text-decoration:underline}.rule{width:100%;background:#f6f7f3;border-radius:9px;padding:13px;text-align:left;margin:10px 0 0}.rule strong{font-size:18px}.rule p{font-size:12px;color:#818875}.days{display:flex;gap:5px;margin-top:8px}.days span,.days button{background:#ecefe7;border-radius:5px;padding:3px 7px;font-size:12px}.days .on{background:#292d27;color:#e0f399}.field{display:block;font-size:13px;margin:15px 0}.field input,.field select{display:block;width:100%;border:1px solid #e3e7dc;border-radius:8px;padding:11px;background:#f7f8f4;margin-top:7px}.actions{padding:12px 16px;background:#fff;border-top:1px solid #e9ece3}.actions .btn{margin:0}.grid{display:grid;grid-template-columns:36px repeat(7,1fr);gap:3px;margin-top:15px}.cell{min-width:0;height:25px;font-size:9px;background:#f0f2eb;border-radius:3px;padding:0}.cell.head{background:transparent;font-size:10px;display:grid;place-items:center}.cell.ruleprice{background:#c9d5ae}.cell.weekend{background:#8d9e72;color:white}.summary{font-size:12px;color:#666e5f;margin-top:12px}.error{color:#a43b2a;font-size:12px}.notice{background:#f1f4e9;padding:12px;border-radius:9px;font-size:12px;color:#68715b;margin:15px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#292d27;color:white;padding:10px 18px;border-radius:9px;font-size:12px}.toast:empty{display:none}button:focus-visible,a:focus-visible{outline:3px solid #98aa64;outline-offset:2px}@media(max-width:700px){.aside{display:none}.layout{padding:0}.phone{width:100%;max-width:460px;margin:auto;height:100dvh;min-height:0;border:0;border-radius:0}.actions{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
</style></head><body><div class="layout"><aside class="aside"><strong>方案 B / 规则式定价</strong><h1>先设基础价，<br>再补例外。</h1><p>试试：工作日18点后120元，周末全天130元，其余80元。</p><p>比较两种方案：能否快速配置、容易检查、理解空白时段的价格。</p><a href="商家中心.html" target="_blank">打开原版排期，对比体验 ↗</a><p>独立演示，保存仅影响本页。</p></aside><main class="phone"><header class="top"><button onclick="home()" aria-label="返回价格总览">‹</button><h1>场地预约定价</h1></header><div class="scroll" id="app"></div><footer class="actions" id="actions"></footer></main></div><div class="toast" id="toast" role="status"></div><script>
'use strict';
const storageKey='maomao-rule-pricing-comparison';
let plan={base:80,rules:[{name:'工作日晚场',days:[0,1,2,3,4],start:18,end:22,price:120},{name:'周末全天',days:[5,6],start:8,end:22,price:130}],holiday:'weekend',special:[],start:'2026-10-27'};
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved)plan=saved;}catch{}
let draft,indexEditing=-1,timer;
const dayNames=['一','二','三','四','五','六','日'];
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const app=document.getElementById('app'),actions=document.getElementById('actions');
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast').textContent='',3000);}
function field(label,id,value,type='text',extra=''){return `<label class="field">${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function footer(text,action){actions.innerHTML=`<button class="btn" onclick="${action}">${text}</button>`;}
function priceFor(day,hour){return plan.rules.find(rule=>rule.days.includes(day)&&hour>=rule.start&&hour<rule.end)?.price??plan.base;}
function home(){app.innerHTML=`<section class="card"><div class="row"><h2>1号网球场</h2><span class="muted">室内硬地</span></div><p class="muted">营业时间 08:00–22:00 · 场地费独立定价</p></section><section class="card"><div class="row"><h2>基础价格</h2><button class="link" onclick="editBase()">修改</button></div><p class="muted">未被价格规则覆盖的营业时段，使用基础价。</p><strong style="font-size:25px">¥${plan.base}<span class="muted"> / 小时</span></strong></section><section class="card"><div class="row"><h2>价格规则</h2><span class="muted">${plan.rules.length}条</span></div>${plan.rules.map((rule,index)=>`<button class="rule" onclick="editRule(${index})"><div class="row"><h3>${esc(rule.name)}</h3><strong>¥${rule.price} ›</strong></div><div class="days">${dayNames.map((day,dayIndex)=>`<span class="${rule.days.includes(dayIndex)?'on':''}">${day}</span>`).join('')}</div><p>${rule.start}:00–${rule.end}:00</p></button>`).join('')}<button class="btn" onclick="editRule(-1)">＋ 添加价格规则</button></section><section class="card"><h2>一周价格预览</h2><p class="muted">点击格子查看最终价格及来源，单位：元/小时。</p><div class="grid"><span></span>${dayNames.map(day=>`<span class="cell head">${day}</span>`).join('')}${Array.from({length:14},(_,offset)=>{const hour=offset+8;return `<span class="cell head">${hour}:00</span>`+dayNames.map((day,dayIndex)=>{const price=priceFor(dayIndex,hour);return `<button class="cell ${price!==plan.base?(dayIndex>4?'weekend':'ruleprice'):''}" aria-label="周${day} ${hour}点 ${price}元" onclick="showPrice(${dayIndex},${hour})">${price}</button>`;}).join('');}).join('')}</div><p class="summary">浅灰：基础价 · 浅绿：工作日规则 · 深绿：周末规则</p></section><section class="card"><button class="row" style="width:100%;text-align:left" onclick="holidays()"><h2>节假日与特殊日期</h2><span>›</span></button><p class="muted">节假日：${plan.holiday==='weekend'?'按周六价格':plan.holiday==='base'?'按基础价':'不开放'}</p><p class="muted">特殊日期 ${plan.special.length} 个</p></section><section class="card">${field('开始生效','effective',plan.start,'date')}<p class="muted">长期有效。特殊日期优先于节假日，节假日优先于周规则；已支付订单不改价。</p><a class="btn secondary" href="商家中心.html" target="_blank">打开原版排期对比 ↗</a></section>`;footer('保存定价方案','savePlan()');}
function showPrice(day,hour){const rule=plan.rules.find(item=>item.days.includes(day)&&hour>=item.start&&hour<item.end);toast(`周${dayNames[day]} ${hour}:00–${hour+1}:00 · ¥${priceFor(day,hour)}/小时 · ${rule?rule.name:'基础价'}`);}
function editBase(){app.innerHTML=`<section class="card"><h2>设置基础价格</h2>${field('元 / 小时','basePrice',plan.base,'number','min="0" step="0.01"')}<p class="muted">只应用于未被其他规则覆盖的营业时段。</p><p class="error" id="error"></p></section>`;footer('确认基础价','saveBase()');}
function saveBase(){const price=Number(document.getElementById('basePrice').value);if(!document.getElementById('basePrice').value||!Number.isFinite(price)||price<0)return document.getElementById('error').textContent='请输入有效价格';plan.base=price;home();}
function editRule(index){indexEditing=index;draft=index<0?{name:'',days:[],start:18,end:22,price:120}:structuredClone(plan.rules[index]);app.innerHTML=`<section class="card"><h2>${index<0?'添加':'编辑'}价格规则</h2>${field('规则名称','ruleName',draft.name,'text','maxlength="20" placeholder="例如：工作日晚场"')}</section><section class="card"><h3>适用星期</h3><div class="days" id="days"></div><p class="muted">可以任意组合星期，不允许时段重叠。</p></section><section class="card"><h3>时段与价格</h3>${field('开始时间（小时）','ruleStart',draft.start,'number','min="8" max="21"')}${field('结束时间（小时）','ruleEnd',draft.end,'number','min="9" max="22"')}${field('元 / 小时','rulePrice',draft.price,'number','min="0" step="0.01"')}<p class="error" id="error" role="alert"></p></section>${index>=0?'<button class="btn secondary" onclick="removeRule()">删除此规则</button>':''}<button class="btn secondary" onclick="home()">取消</button>`;renderDays();footer('确认规则','saveRule()');}
function renderDays(){document.getElementById('days').innerHTML=dayNames.map((day,index)=>`<button class="${draft.days.includes(index)?'on':''}" aria-pressed="${draft.days.includes(index)}" onclick="toggleDay(${index})">${day}</button>`).join('');}
function toggleDay(index){draft.days=draft.days.includes(index)?draft.days.filter(day=>day!==index):[...draft.days,index];renderDays();}
function saveRule(){const name=document.getElementById('ruleName').value.trim(),start=Number(document.getElementById('ruleStart').value),end=Number(document.getElementById('ruleEnd').value),price=Number(document.getElementById('rulePrice').value);const error=document.getElementById('error');if(!name||!draft.days.length||!Number.isInteger(start)||!Number.isInteger(end)||start<8||end>22||start>=end||!document.getElementById('rulePrice').value||!Number.isFinite(price)||price<0){error.textContent='请填写名称、星期、08–22点内有效时段及价格';return;}const conflict=plan.rules.find((rule,index)=>index!==indexEditing&&rule.days.some(day=>draft.days.includes(day))&&start<rule.end&&end>rule.start);if(conflict){error.textContent='与「'+conflict.name+'」重叠，请调整星期或时段';return;}const rule={name,days:draft.days,start,end,price};if(indexEditing<0)plan.rules.push(rule);else plan.rules[indexEditing]=rule;home();toast('规则已更新，保存方案后生效');}
function removeRule(){plan.rules.splice(indexEditing,1);home();toast('规则已移除，保存方案后生效');}
function holidays(){app.innerHTML=`<section class="card"><h2>节假日价格策略</h2><label class="field">法定节假日<select id="holiday"><option value="weekend">按周六完整分时价格</option><option value="base">按基础价</option><option value="closed">不开放</option></select></label><p class="muted">调休上班日按实际星期计价。本对比版不接入节假日日历，周预览仅展示普通星期。</p></section><section class="card"><h2>特殊日期</h2><p class="muted">本版体验按天设置例外价格；停场涉及已有订单，仍需在原版排期处理。</p>${plan.special.map(item=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><span>${item.date}</span><strong>¥${item.price}/小时</strong><button class="link" onclick="deleteSpecial('${item.date}')">删除</button></div>`).join('')}${field('日期','specialDate','','date')}${field('全天价格 · 元/小时','specialPrice','','number','min="0" step="0.01"')}<button class="btn secondary" onclick="addSpecial()">添加 / 更新特殊日期</button><p class="error" id="error" role="alert"></p></section><p class="notice">特殊日期 ＞ 节假日 ＞ 星期规则 ＞ 基础价。特殊日期在营业时间内全天生效。</p>`;document.getElementById('holiday').value=plan.holiday;footer('确认节日设置','saveHoliday()');}
function addSpecial(){plan.holiday=document.getElementById('holiday').value;const date=document.getElementById('specialDate').value,raw=document.getElementById('specialPrice').value,price=Number(raw);if(!date||!raw||!Number.isFinite(price)||price<0)return document.getElementById('error').textContent='请填写日期和有效价格';plan.special=plan.special.filter(item=>item.date!==date);plan.special.push({date,price});plan.special.sort((first,second)=>first.date.localeCompare(second.date));holidays();}
function deleteSpecial(date){plan.holiday=document.getElementById('holiday').value;plan.special=plan.special.filter(item=>item.date!==date);holidays();}
function saveHoliday(){plan.holiday=document.getElementById('holiday').value;home();}
function savePlan(){const date=document.getElementById('effective').value;if(!date)return toast('请选择生效日期');plan.start=date;try{localStorage.setItem(storageKey,JSON.stringify(plan));toast('对比版定价已保存，原版数据未改动');}catch{toast('浏览器未允许保存，请保留当前页面');}}
home();
</script><script src="规则定价-交互优化.js"></script><script src="规则定价-多场地.js"></script><script src="规则定价-完整流程.js"></script><script src="规则定价-涂抹.js"></script><script src="规则定价-流程修订.js"></script></body></html>
